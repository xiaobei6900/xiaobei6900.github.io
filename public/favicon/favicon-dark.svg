<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2b3f"/>
      <stop offset="100%" stop-color="#1c1c2b"/>
    </linearGradient>
    <linearGradient id="sunDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a99cff"/>
      <stop offset="100%" stop-color="#7c86ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角底 -->
  <rect width="128" height="128" rx="30" ry="30" fill="url(#bgDark)"/>

  <!-- 光芒 -->
  <g stroke="#a99cff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="20" x2="64" y2="30"/>
    <line x1="34" y1="31" x2="41" y2="38"/>
    <line x1="94" y1="31" x2="87" y2="38"/>
    <line x1="21" y1="58" x2="31" y2="58"/>
    <line x1="107" y1="58" x2="97" y2="58"/>
  </g>

  <!-- 半升的太阳 -->
  <path d="M34 80a30 30 0 0 1 60 0z" fill="url(#sunDark)"/>

  <!-- 地平线 -->
  <line x1="22" y1="94" x2="106" y2="94" stroke="#a99cff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
</svg>
